seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: False
  policy:  # see gaussian_model parameters
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -1.2  # exp(-1.2) = 0.30, matching the rsl_rl init_noise_std
    network:
      - name: net
        input: STATES
        layers: [256, 256, 128]
        activations: elu
      - name: rnn
        input: net
        layers: [64]
        activations: elu
        rnn: GRU
        num_layers: 1
    output: ACTIONS
  value:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [256, 256, 128]
        activations: elu
      - name: rnn
        input: net
        layers: [64]
        activations: elu
        rnn: GRU
        num_layers: 1
    output: ONE


# Rollout memory
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration
agent:
  class: PPO
  rollouts: 32
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 1.0e-03
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  # Matches empirical_normalization in the rsl_rl config: the observation terms carry no
  # fixed scales, so the preprocessor is what puts the inputs on a common footing.
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.002
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  # logging and checkpoint
  experiment:
    directory: "matrice_track_trajectory"
    experiment_name: ""
    write_interval: 100
    checkpoint_interval: 1000


# Sequential trainer
trainer:
  class: SequentialTrainer
  timesteps: 64000
  environment_info: log
